<div class="card">
  
  <a class="clickable" [routerLink]="['/products', product.id]">
    <div class="image-container">
      <img 
        [src]="product.image_url || 'https://via.placeholder.com/300x200'"
        class="product-image"
        [alt]="product.name"
      />
    </div>

    <h3 class="title">{{ product.name }}</h3>
    <p class="price">\${{ product.price }}</p>
  </a>

  <button class="add-btn" (click)="emitAddToCart()">
    Add to Cart
  </button>

</div>
