<div class="product-grid">
  <div *ngFor="let product of products" class="product-card">
    <a [routerLink]="['/products', product.id]" class="product-link">
      <h3>{{ product.name }}</h3>
      <p>\${{ product.price }}</p>
    </a>
    <button (click)="addToCart(product)">Add to Cart</button>
  </div>
</div>
