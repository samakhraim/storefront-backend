<section class="checkout-section">
  <h2>Checkout</h2>

  <form #checkoutForm="ngForm" (ngSubmit)="onSubmit(checkoutForm)">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input id="name" name="name" ngModel required />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" ngModel type="email" required />
    </div>

    <div class="form-group">
      <label for="address">Shipping Address</label>
      <textarea id="address" name="address" ngModel required></textarea>
    </div>

    <div class="form-group">
      <label for="payment">Payment Method</label>
      <select id="payment" name="payment" ngModel required>
        <option value="">Select...</option>
        <option value="Credit Card">Credit Card</option>
        <option value="PayPal">PayPal</option>
      </select>
    </div>

    <button type="submit" class="checkout-btn">Place Order</button>
  </form>
</section>
