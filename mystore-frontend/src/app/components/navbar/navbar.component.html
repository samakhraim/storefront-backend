<nav class="navbar">
  <div class="navbar-left">
    <a routerLink="/" class="logo">
      <span class="logo-icon">🛍️</span> MyStore
    </a>
  </div>

  <!-- Mobile Hamburger -->
  <div class="hamburger" (click)="isMenuOpen = !isMenuOpen">
    <span></span><span></span><span></span>
  </div>

  <ul class="navbar-links" [class.open]="isMenuOpen">

    <li>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Products
      </a>
    </li>

    <li>
      <a routerLink="/cart" routerLinkActive="active">
        Cart <span class="cart-count">({{ cartCount }})</span>
      </a>
    </li>

    <li>
      <a routerLink="/checkout" routerLinkActive="active">
        Checkout
      </a>
    </li>

  

    <li *ngIf="isLoggedIn">
      <a (click)="logout()" class="logout-btn">Sign Out</a>
    </li>

    <!-- Show login link when NOT logged in -->
    <li *ngIf="!isLoggedIn">
      <a routerLink="/login" routerLinkActive="active">Login</a>
    </li>

  </ul>
</nav>
